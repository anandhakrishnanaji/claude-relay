version: '3'
services:
  claude-wrapper:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Read-write: the CLI refreshes its OAuth token in place
      - ~/.claude:/home/app/.claude
      # Optional: Mount a specific workspace directory
      # Uncomment and modify the line below to use a custom workspace
      # - ./workspace:/workspace
    environment:
      - PORT=8000
      # Keep the CLI config (.claude.json) inside the mounted dir
      - CLAUDE_CONFIG_DIR=/home/app/.claude
      # Uncomment to let requests with "enable_tools": true run Bash/Write/Edit
      # - ALLOW_TOOLS=true
      # Optional: Set Claude's working directory (defaults to isolated temp dir)
      # Uncomment and modify the line below to set a custom working directory
      # - CLAUDE_CWD=/workspace
