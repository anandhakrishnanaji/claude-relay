# Tailnet-only deployment behind tsdproxy: https://claude.<tailnet>.ts.net/v1
# Requires an existing tsdproxy on the external "proxy" network and a Claude
# CLI login on the host (~/.claude/.credentials.json via `claude auth login`).
services:
  claude-wrapper:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: claude-wrapper:local
    container_name: claude-wrapper
    restart: unless-stopped
    environment:
      TZ: Asia/Calcutta
      # Keep the CLI config (.claude.json) inside the mounted dir
      CLAUDE_CONFIG_DIR: /home/app/.claude
      RATE_LIMIT_ENABLED: "false"
      MAX_TIMEOUT: "600000"
      # Uncomment to require "Authorization: Bearer <key>" from clients
      # API_KEY: ${API_KEY}
    volumes:
      # Read-write: the CLI refreshes its OAuth token in place
      - ${HOME}/.claude:/home/app/.claude
    networks:
      - proxy
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "claude"
      tsdproxy.container_port: "8000"
      # No funnel: keep this private to your tailnet

networks:
  proxy:
    external: true
